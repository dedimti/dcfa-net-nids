[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "1.0.0"
description = "LeakGuard: an intelligent audit system attributing reported NIDS accuracy to evaluation choices rather than detection skill."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Dedi Irawan" },
    { name = "Sudarmaji" },
    { name = "Imam Samsudin" },
]
keywords = [
    "network intrusion detection",
    "benchmark auditing",
    "feature leakage",
    "attention networks",
    "reproducibility",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "torch>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["datasets>=2.10"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.urls]
Repository = "https://github.com/dedimti/dcfa-net-nids"

[project.scripts]
leakguard-audit = "leakguard.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
